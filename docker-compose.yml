services:
  postgres:
    image: postgres:16-alpine
    container_name: musang-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: musang_blacklist
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: musang-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/musang_blacklist?schema=public"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      SESSION_SECRET: "a-very-secure-random-secret-for-musang-app-32"
      NODE_ENV: "production"
      RATE_LIMIT_MAX_REQUESTS: "60"
      RATE_LIMIT_WINDOW_MS: "60000"
      MAX_FILE_SIZE_MB: "2"
      MAX_EVIDENCE_FILES: "3"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - evidence_uploads:/app/public/uploads/evidence

volumes:
  pgdata:
  evidence_uploads:
